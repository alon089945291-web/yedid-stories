<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>סיפורי ידיד נפש</title>
</head>
<body>

<!-- כאן יופיע קוד המערכת המלא -->
<script>
    // פונקציה לטעינת הנתונים מקובץ ה-JSON ב-GitHub ושילובם במערכת
    async function initStoriesSystem() {
        try {
            const response = await fetch('stories.json?v=' + new Date().getTime());
            if (response.ok) {
                const fileData = await response.json();
                if (fileData && fileData.length > 0) {
                    // טעינת הנתונים מהקובץ אל נתוני המערכת
                    var savedData = JSON.parse(localStorage.getItem('yn_published_data') || '{}');
                    savedData.slides = fileData;
                    window.YN_DATA = savedData;
                }
            }
        } catch (e) {
            console.log("טוען מברירת מחדל מקומית");
        }

        // הפעלת סקריפט המערכת המקורי
        runStoryApp();
    }

    function runStoryApp() {
        // כאן מודבק הקוד המלא של המערכת שלך
        window.YN_DATA = window.YN_DATA || JSON.parse(localStorage.getItem('yn_published_data') || '{"settings":{"dur":5,"capStyle":"glass","capBg":"#0f3d3a","capColor":"#ffffff","capSize":20,"ring":"#1fa795","allowEmoji":true,"allowComments":true,"adminCode":"0527148454"},"slides":[],"replies":{},"userComments":[],"views":{}}');

        // (הקוד המלא שלך ממשיך מכאן...)
    }

    initStoriesSystem();
</script>

</body>
</html>
