<style>

.tags{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tag{flex:none;border:1px solid var(--line);background:var(--card2);color:var(--mute);border-radius:99px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer}
.tag.on{background:var(--accent);border-color:var(--accent);color:#fff}

:root[data-theme=light] .day span{background:rgba(0,0,0,.12);color:#334}
.post{background:var(--bubble);border-radius:16px;border-top-right-radius:4px;margin:0 0 10px;overflow:hidden;max-width:100%;box-shadow:0 1px 2px rgba(0,0,0,.2);animation:in .3s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.post img,.post video{display:block;width:100%;max-height:480px;object-fit:cover;background:#000}
.pb{padding:10px 14px 8px}
.pt{font-weight:700;font-size:16px;margin-bottom:4px;color:var(--accent)}
.px{white-space:pre-wrap;word-wrap:break-word;font-size:15.5px}
.px a{color:var(--accent)}

.rx{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 10px}
.r{border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:99px;padding:2px 10px;font-size:13.5px;cursor:pointer;font-family:inherit}
.r.me{border-color:var(--accent);background:rgba(78,164,246,.18)}
.sh{background:none;border:0;color:var(--mute);cursor:pointer;font-size:13px}
.sh:hover{color:var(--accent)}
.pin{border-right:3px solid var(--accent)}
.empty{text-align:center;color:var(--mute);padding:60px 0}

footer{text-align:center;color:var(--mute);font-size:12px;padding:20px 0 40px}
</style>
</head>
