name: tiktok

on:
  workflow_dispatch:
    inputs:
      q:
        description: "מה לחפש"
        default: ""
      type:
        description: "video | tag | user | all"
        default: "video"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: התקנת דפדפן
        run: |
          python -m pip install -U pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: פענוח עוגיות (אם נשלחו)
        env:
          COOKIES_B64: ${{ secrets.YT_COOKIES_B64 }}
        run: |
          python - <<'PY'
          import base64, gzip, os, sys
          b64 = os.environ.get("COOKIES_B64", "")
          if not b64:
              sys.exit(0)
          raw = base64.b64decode(b64)
          if raw[:2] == b"\x1f\x8b":
              raw = gzip.decompress(raw)
          with open("cookies.txt", "wb") as f:
              f.write(raw)
          print("cookies.txt נכתב,", len(raw), "בייט")
          PY

      - name: חיפוש
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          Q: ${{ github.event.inputs.q }}
          TYPE: ${{ github.event.inputs.type }}
        run: python scripts/tiktok_search.py
