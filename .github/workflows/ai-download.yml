name: ai-download
run-name: ai-download ${{ github.event.inputs.job }}

on:
  workflow_dispatch:
    inputs:
      job:
        description: "מזהה הבקשה (נוצר בתוסף)"
        required: true
      data:
        description: "הקישור והעוגיות – מוצפנים"
        required: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: כלים
        run: python -m pip install -q cryptography requests

      - name: הורדה ואריזה ל-ZIP
        env:
          KEY_B64: ${{ secrets.AI_DL_KEY }}
          DATA: ${{ github.event.inputs.data }}
        run: |
          python - <<'PY'
          import base64, gzip, json, os, re, sys, zipfile, http.cookiejar, urllib.parse
          import requests
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          key = base64.b64decode(os.environ["KEY_B64"])
          raw = base64.b64decode(os.environ["DATA"])
          job = json.loads(gzip.decompress(AESGCM(key).decrypt(raw[:12], raw[12:], None)))
          url = job["url"]
          print("::add-mask::" + url)

          os.makedirs("out", exist_ok=True)
          with open("cookies.txt", "w", encoding="utf-8") as f:
              f.write(job.get("cookies") or "# Netscape HTTP Cookie File\n")
          jar = http.cookiejar.MozillaCookieJar("cookies.txt")
          jar.load(ignore_discard=True, ignore_expires=True)

          s = requests.Session()
          s.cookies = jar
          s.headers.update({
              "User-Agent": job.get("ua") or "Mozilla/5.0",
              "Accept": "*/*",
          })
          if job.get("ref"):
              s.headers["Referer"] = job["ref"]
          if job.get("auth"):
              s.headers["Authorization"] = job["auth"]

          r = s.get(url, stream=True, allow_redirects=True, timeout=120)
          ctype = r.headers.get("content-type", "")
          # קישור של ChatGPT שמחזיר JSON עם download_url – הולכים אליו
          if r.ok and "application/json" in ctype:
              body = r.json()
              if isinstance(body, dict) and body.get("download_url"):
                  job["name"] = job.get("name") or body.get("file_name")
                  r = s.get(body["download_url"], stream=True, allow_redirects=True, timeout=120)
                  ctype = r.headers.get("content-type", "")
          # Gemini: הקישור הראשון מחזיר טקסט שהוא רק הקישור האמיתי לתמונה – הולכים אליו
          for _ in range(2):
              if not (r.ok and ctype.startswith("text/")):
                  break
              body = r.content[:20000].strip()
              if not (body.startswith(b"https://") and b"\n" not in body):
                  break
              r = s.get(body.decode(), stream=True, allow_redirects=True, timeout=120)
              ctype = r.headers.get("content-type", "")
          if not r.ok:
              hint = " – כנראה צריך להתחבר מחדש באתר" if r.status_code in (401, 403) else ""
              open("error.txt", "w", encoding="utf-8").write("השרת של האתר החזיר שגיאה %s%s" % (r.status_code, hint))
              sys.exit(1)

          name = job.get("name") or ""
          cd = r.headers.get("content-disposition", "")
          m = re.search(r"filename\*=UTF-8''([^;]+)", cd) or re.search(r'filename="?([^";]+)"?', cd)
          if not name and m:
              name = urllib.parse.unquote(m.group(1))
          if not name and "google" in urllib.parse.urlparse(r.url).hostname:
              name = "gemini-image"
          if not name:
              name = os.path.basename(urllib.parse.urlparse(r.url).path)[:60] or "file"
          name = re.sub(r'[\\/:*?"<>|\x00-\x1f]', "_", name).strip()[:120] or "file"
          ext_by_type = {"image/png": ".png", "image/jpeg": ".jpg", "image/webp": ".webp",
                         "application/pdf": ".pdf", "text/csv": ".csv", "video/mp4": ".mp4"}
          if "." not in name:
              name += ext_by_type.get(ctype.split(";")[0].strip(), "")

          with open("out/" + name, "wb") as f:
              for chunk in r.iter_content(1 << 20):
                  f.write(chunk)
          size = os.path.getsize("out/" + name)
          if size == 0:
              sys.exit("הקובץ שהתקבל ריק")

          base = os.path.splitext(name)[0] or "file"
          os.makedirs("pack", exist_ok=True)
          with zipfile.ZipFile("pack/%s.zip" % base, "w", zipfile.ZIP_DEFLATED) as z:
              z.write("out/" + name, name)
          print("ok", size, "bytes")
          PY
          rm -f cookies.txt

      - name: העלאה לנכסים
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "ai-${{ github.event.inputs.job }}" pack/*.zip --title "ai-download" --notes "נמחק אוטומטית" --prerelease

      - name: דיווח על תקלה
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          [ -s error.txt ] || echo "ההורדה נכשלה בריצה. רעננו את הדף באתר ונסו שוב." > error.txt
          gh release create "ai-${{ github.event.inputs.job }}" error.txt --title "ai-download error" --notes "" --prerelease || true

      - name: ניקוי הורדות ישנות (מעל שעתיים)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cutoff=$(date -u -d '2 hours ago' +%s)
          gh release list --limit 100 --json tagName,createdAt -q '.[] | select(.tagName|startswith("ai-")) | "\(.tagName) \(.createdAt)"' | while read tag created; do
            if [ "$(date -u -d "$created" +%s)" -lt "$cutoff" ]; then gh release delete "$tag" --yes --cleanup-tag || true; fi
          done
