name: ai-search
run-name: ai-search ${{ github.event.inputs.job }}

on:
  workflow_dispatch:
    inputs:
      job:
        description: "מזהה הבקשה (נוצר בתוסף)"
        required: true
      data:
        description: "החיפוש – מוצפן"
        required: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: כלים
        run: python -m pip install -q cryptography requests beautifulsoup4

      - name: חיפוש
        env:
          KEY_B64: ${{ secrets.AI_DL_KEY }}
          DATA: ${{ github.event.inputs.data }}
        run: |
          python - <<'PY'
          import base64, gzip, json, os, urllib.parse
          import requests
          from bs4 import BeautifulSoup
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          key = base64.b64decode(os.environ["KEY_B64"])
          raw = base64.b64decode(os.environ["DATA"])
          req = json.loads(gzip.decompress(AESGCM(key).decrypt(raw[:12], raw[12:], None)))
          q = req["q"]
          page = int(req.get("page") or 0)
          print("::add-mask::" + q)

          UA = req.get("ua") or "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36"
          s = requests.Session()
          s.headers.update({"User-Agent": UA, "Accept-Language": "he-IL,he;q=0.9,en;q=0.8"})

          def clean(t):
              return " ".join((t or "").split())

          def google():
              r = s.get("https://www.google.com/search", params={"q": q, "hl": "iw", "num": 20, "start": page * 20}, timeout=20)
              soup = BeautifulSoup(r.text, "html.parser")
              out = []
              for h3 in soup.select("a h3"):
                  a = h3.find_parent("a")
                  href = a.get("href", "")
                  if href.startswith("/url?"):
                      href = urllib.parse.parse_qs(urllib.parse.urlparse(href).query).get("q", [""])[0]
                  if not href.startswith("http") or "google.com" in urllib.parse.urlparse(href).netloc:
                      continue
                  box = a.find_parent("div", class_=True)
                  snip = ""
                  for _ in range(4):
                      if box is None:
                          break
                      txt = clean(box.get_text(" "))
                      if len(txt) > len(clean(h3.get_text())) + 40:
                          snip = txt.replace(clean(h3.get_text()), "", 1)[:300]
                          break
                      box = box.find_parent("div")
                  out.append({"title": clean(h3.get_text()), "url": href, "snippet": snip})
              return out

          def bing():
              r = s.get("https://www.bing.com/search", params={"q": q, "setlang": "he", "count": 20, "first": page * 20 + 1}, timeout=20)
              soup = BeautifulSoup(r.text, "html.parser")
              out = []
              for li in soup.select("li.b_algo"):
                  a = li.select_one("h2 a")
                  if not a or not a.get("href", "").startswith("http"):
                      continue
                  p = li.select_one(".b_caption p") or li.select_one("p")
                  out.append({"title": clean(a.get_text()), "url": a["href"], "snippet": clean(p.get_text() if p else "")[:300]})
              return out

          def ddg():
              r = s.post("https://html.duckduckgo.com/html/", data={"q": q, "kl": "il-he", "s": page * 30}, timeout=20)
              soup = BeautifulSoup(r.text, "html.parser")
              out = []
              for res in soup.select(".result"):
                  a = res.select_one("a.result__a")
                  if not a:
                      continue
                  href = a.get("href", "")
                  if "uddg=" in href:
                      href = urllib.parse.parse_qs(urllib.parse.urlparse(href).query).get("uddg", [""])[0]
                  if not href.startswith("http"):
                      continue
                  sn = res.select_one(".result__snippet")
                  out.append({"title": clean(a.get_text()), "url": href, "snippet": clean(sn.get_text() if sn else "")[:300]})
              return out

          results, source, notes = [], "", []
          for name, fn in (("Google", google), ("Bing", bing), ("DuckDuckGo", ddg)):
              try:
                  results = fn()
              except Exception as e:
                  notes.append("%s: %s" % (name, type(e).__name__))
                  results = []
              if results:
                  source = name
                  break
              notes.append(name + ": אין תוצאות או שנחסם")

          out = json.dumps({"q": q, "page": page, "source": source, "results": results, "notes": notes}, ensure_ascii=False)
          iv = os.urandom(12)
          enc = iv + AESGCM(key).encrypt(iv, gzip.compress(out.encode()), None)
          os.makedirs("pack", exist_ok=True)
          open("pack/results.txt", "w").write(base64.b64encode(enc).decode())
          print("source:", source or "none", "count:", len(results))
          PY

      - name: העלאה לנכסים
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "s-${{ github.event.inputs.job }}" pack/results.txt --title "ai-search" --notes "נמחק אוטומטית" --prerelease

      - name: דיווח על תקלה
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "החיפוש נכשל בריצה." > error.txt
          gh release create "s-${{ github.event.inputs.job }}" error.txt --title "ai-search error" --notes "" --prerelease || true

      - name: ניקוי חיפושים ישנים (מעל שעה)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cutoff=$(date -u -d '1 hour ago' +%s)
          gh release list --limit 100 --json tagName,createdAt -q '.[] | select(.tagName|startswith("s-")) | "\(.tagName) \(.createdAt)"' | while read tag created; do
            if [ "$(date -u -d "$created" +%s)" -lt "$cutoff" ]; then gh release delete "$tag" --yes --cleanup-tag || true; fi
          done
